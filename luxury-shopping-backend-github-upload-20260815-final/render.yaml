services:
  - type: web
    name: luxury-shopping-backend
    runtime: python
    plan: starter
    region: virginia
    branch: main
    buildCommand: python -m pip install -r requirements.txt
    preDeployCommand: python -m alembic upgrade head
    # Migrations run once in preDeployCommand. Running them again on every
    # process start needlessly delays cold starts and restarts.
    # uvloop + httptools are installed by uvicorn[standard] and provide the
    # fastest supported event loop and HTTP parser on Render's Linux runtime.
    # Access logging is disabled because the app already emits one redacted
    # structured request-completion log per request.
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --loop uvloop --http httptools --no-access-log
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: ALLOW_TEST_FIXTURES
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.10"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_MIGRATION_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RENDER_PUBLIC_URL
        # Render exposes the real public service URL automatically. Map it to
        # the setting name used by the FastAPI application instead of keeping
        # a placeholder hostname in the Blueprint.
        fromService:
          type: web
          name: luxury-shopping-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: UPLOAD_DIR
        value: /tmp/luxury-backend-upload-quarantine
      - key: STORAGE_PROVIDER
        value: r2
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_BUCKET
        value: luxury-images-prod
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_REGION
        value: auto
      - key: R2_PUBLIC_BASE_URL
        value: https://images.luxuryshoppings.com
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: BACKUP_ENCRYPTION_KEY
        generateValue: true
      # Backups must be offsite and durable. The backend maps the S3-compatible
      # backup client to the configured R2 credentials when BACKUP_S3_* values
      # are not supplied separately.
      - key: BACKUP_OFFSITE_PROVIDER
        value: s3
      - key: BACKUP_S3_PREFIX
        value: luxury-secure-backups
      - key: CORS_ORIGINS
        value: https://luxuryshoppings.com,https://www.luxuryshoppings.com
      - key: REALTIME_ALLOWED_ORIGINS
        value: https://luxuryshoppings.com,https://www.luxuryshoppings.com
      - key: API_BASE_URL
        value: https://api.luxuryshoppings.com
      - key: APP_PUBLIC_URL
        value: https://api.luxuryshoppings.com
      - key: FRONTEND_PUBLIC_URL
        value: https://luxuryshoppings.com
      - key: WS_BASE_URL
        value: wss://api.luxuryshoppings.com
      - key: ENABLE_MESSAGE_WORKER
        # Keep provider calls and outbox polling off the request-serving event
        # loop.  The dedicated worker service below owns this workload.
        value: "false"
      - key: MESSAGE_WORKER_POLL_SECONDS
        value: "5"
      - key: PUBLIC_READ_CACHE_TTL_SECONDS
        value: "30"
      - key: FIREBASE_PROJECT_ID
        value: luxury-345be
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: luxuryshoppingsye@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: luxuryshoppingsye@gmail.com
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_URL
        value: https://api.resend.com/emails
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: AI_PROVIDER_NAME
        value: gemini
      - key: AI_DEFAULT_MODEL
        value: gemini-2.5-flash
      - key: AI_MODEL_ALLOWLIST
        value: gemini-2.5-flash
      - key: IMAGE_AI_ENHANCEMENT_ENABLED
        value: "true"
      - key: IMAGE_AI_MODEL
        value: gemini-2.5-flash-image
      - key: IMAGE_AI_TIMEOUT_SECONDS
        value: "30"
      - key: IMAGE_AI_MAX_INPUT_BYTES
        value: "5242880"
      - key: IMAGE_MAX_DIMENSION
        value: "2400"
      - key: IMAGE_MIN_DIMENSION
        value: "900"
      - key: GEMINI_API_KEY
        sync: false
  - type: worker
    name: luxury-shopping-message-worker
    runtime: python
    plan: starter
    region: virginia
    branch: main
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m app.workers.message_worker
    maxShutdownDelaySeconds: 60
    envVars:
      - key: APP_ENV
        value: production
      - key: ALLOW_TEST_FIXTURES
        value: "false"
      - key: DATABASE_URL
        fromService:
          type: web
          name: luxury-shopping-backend
          envVarKey: DATABASE_URL
      - key: JWT_SECRET
        fromService:
          type: web
          name: luxury-shopping-backend
